<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Размеры встроенных типов</title>
  <desc id="d">Каждая клетка — один байт. bool, byte и sbyte занимают 1 байт, char, short и ushort — 2 байта, int, uint и float — 4 байта, long, ulong и double — 8 байт, decimal — 16 байт.</desc>
  <style>
    .panel{fill:var(--fig-panel,#F3F2F7)}
    .cell{fill:var(--fig-cell,#FFFFFF);stroke:var(--fig-line,#C9C9D1);stroke-width:1.5}
    .hl{fill:var(--fig-accent-soft,#ECE8FF);stroke:var(--fig-accent,#5B3FD9);stroke-width:1.5}
    .m{fill:var(--fig-muted,#5C5C66);font:13px Inter,system-ui,sans-serif}
    .h{fill:var(--fig-text,#26262C);font:600 14px Inter,system-ui,sans-serif}
    .code{fill:var(--fig-text,#26262C);font:500 14px 'JetBrains Mono',Consolas,monospace}
  </style>

  <text x="20" y="26" class="h">Одна клетка — один байт</text>
  <rect x="20" y="38" width="680" height="248" rx="12" class="panel"/>

  <text x="40" y="78" class="code">bool byte sbyte</text>
  <rect x="210" y="60" width="26" height="26" rx="3" class="cell"/>
  <text x="680" y="78" class="m" text-anchor="end">1 байт</text>

  <text x="40" y="122" class="code">char short ushort</text>
  <rect x="210" y="104" width="26" height="26" rx="3" class="cell"/>
  <rect x="238" y="104" width="26" height="26" rx="3" class="cell"/>
  <text x="680" y="122" class="m" text-anchor="end">2 байта</text>

  <text x="40" y="166" class="code">int uint float</text>
  <rect x="210" y="148" width="26" height="26" rx="3" class="hl"/>
  <rect x="238" y="148" width="26" height="26" rx="3" class="hl"/>
  <rect x="266" y="148" width="26" height="26" rx="3" class="hl"/>
  <rect x="294" y="148" width="26" height="26" rx="3" class="hl"/>
  <text x="680" y="166" class="m" text-anchor="end">4 байта</text>

  <text x="40" y="210" class="code">long ulong double</text>
  <rect x="210" y="192" width="26" height="26" rx="3" class="cell"/>
  <rect x="238" y="192" width="26" height="26" rx="3" class="cell"/>
  <rect x="266" y="192" width="26" height="26" rx="3" class="cell"/>
  <rect x="294" y="192" width="26" height="26" rx="3" class="cell"/>
  <rect x="322" y="192" width="26" height="26" rx="3" class="cell"/>
  <rect x="350" y="192" width="26" height="26" rx="3" class="cell"/>
  <rect x="378" y="192" width="26" height="26" rx="3" class="cell"/>
  <rect x="406" y="192" width="26" height="26" rx="3" class="cell"/>
  <text x="680" y="210" class="m" text-anchor="end">8 байт</text>

  <text x="40" y="254" class="code">decimal</text>
  <rect x="210" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="238" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="266" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="294" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="322" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="350" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="378" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="406" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="434" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="462" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="490" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="518" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="546" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="574" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="602" y="236" width="26" height="26" rx="3" class="cell"/>
  <rect x="630" y="236" width="26" height="26" rx="3" class="cell"/>
  <text x="680" y="254" class="m" text-anchor="end">16</text>
</svg>
