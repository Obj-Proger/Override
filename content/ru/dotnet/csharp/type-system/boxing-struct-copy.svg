<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="t d">
  <title id="t">Структура и её упакованная копия</title>
  <desc id="d">В стеке переменная counter со значением Value 0 и переменная boxed с адресом. Адрес указывает на объект в куче с типом Counter и значением Value 1. Метод Increment изменил копию в куче, а исходная переменная осталась прежней.</desc>
  <style>
    .panel{fill:var(--fig-panel,#F3F2F7)}
    .cell{fill:var(--fig-cell,#FFFFFF);stroke:var(--fig-line,#C9C9D1);stroke-width:1.5}
    .hl{fill:var(--fig-accent-soft,#ECE8FF);stroke:var(--fig-accent,#5B3FD9);stroke-width:2}
    .t{fill:var(--fig-text,#26262C);font:500 15px Inter,system-ui,sans-serif}
    .m{fill:var(--fig-muted,#5C5C66);font:13px Inter,system-ui,sans-serif}
    .h{fill:var(--fig-text,#26262C);font:600 14px Inter,system-ui,sans-serif}
    .code{fill:var(--fig-text,#26262C);font:500 14px 'JetBrains Mono',Consolas,monospace}
    .big{fill:var(--fig-text,#26262C);font:600 18px 'JetBrains Mono',Consolas,monospace}
    .acc{fill:var(--fig-accent,#5B3FD9);font:700 18px 'JetBrains Mono',Consolas,monospace}
    .arrow{fill:none;stroke:var(--fig-accent,#5B3FD9);stroke-width:2}
    .dot{fill:var(--fig-accent,#5B3FD9)}
  </style>
  <defs>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="dot"/>
    </marker>
  </defs>

  <text x="20" y="26" class="h">Стек</text>
  <rect x="20" y="38" width="250" height="196" rx="12" class="panel"/>

  <rect x="40" y="60" width="210" height="66" rx="8" class="cell"/>
  <text x="56" y="84" class="code">Counter counter</text>
  <text x="56" y="112" class="big">Value = 0</text>

  <rect x="40" y="146" width="210" height="66" rx="8" class="cell"/>
  <text x="56" y="170" class="code">ICounter boxed</text>
  <text x="56" y="198" class="m">адрес объекта</text>
  <circle cx="234" cy="192" r="6" class="dot"/>

  <text x="310" y="26" class="h">Управляемая куча</text>
  <rect x="310" y="38" width="390" height="196" rx="12" class="panel"/>

  <rect x="360" y="112" width="92" height="66" rx="6" class="cell"/>
  <text x="406" y="150" class="m" text-anchor="middle">Заголовок</text>
  <rect x="452" y="112" width="110" height="66" rx="6" class="cell"/>
  <text x="507" y="138" class="t" text-anchor="middle">Тип:</text>
  <text x="507" y="162" class="code" text-anchor="middle">Counter</text>
  <rect x="562" y="112" width="118" height="66" rx="6" class="hl"/>
  <text x="621" y="151" class="acc" text-anchor="middle">Value = 1</text>

  <path d="M240 192C310 192 310 150 354 146" class="arrow" marker-end="url(#ah3)"/>

  <text x="520" y="80" class="m" text-anchor="middle">копия, созданная при ICounter boxed = counter</text>
  <text x="520" y="208" class="m" text-anchor="middle">boxed.Increment() изменил эту копию</text>
</svg>
